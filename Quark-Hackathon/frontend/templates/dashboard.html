<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Guardian Dashboard</title>

    <link rel="stylesheet" href="../static/css/style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>🛡 AI Guardian</h1>

        <div id="clock">00:00:00</div>

    </header>

    <!-- Summary Cards -->

    <div class="stats">

        <div class="stat-card">
            <h3>📷 Camera</h3>
            <p id="camera">Waiting...</p>
        </div>

        <div class="stat-card">
            <h3>👤 User</h3>
            <p>
                <span id="person">--</span><br>
                Age <span id="age">--</span>
            </p>
        </div>

        <div class="stat-card">
            <h3>🛡 Protection</h3>
            <p id="protection">🟢 Active</p>
        </div>

        <div class="stat-card">
            <h3>🌐 Status</h3>
            <p id="websiteStatus">Waiting...</p>
        </div>

    </div>

    <!-- Website -->

    <div class="card">

        <h2>🌐 Current Website</h2>

        <p id="website">Waiting...</p>

    </div>

    <!-- AI Detection -->

    <div class="card">

        <h2>🤖 AI Detection</h2>

        <p><strong>Confidence:</strong> <span id="confidence">--</span></p>

    </div>

    <!-- Activity -->

    <div class="card">

        <h2>🕒 Recent Activity</h2>

        <table id="activityTable">

            <thead>

                <tr>

                    <th>Time</th>
                    <th>Website</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script src="../static/js/dashboard.js"></script>

</body>

</html>
